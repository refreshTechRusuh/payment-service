name: Build & Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: payment-service
  AR_HOST: asia-southeast2-docker.pkg.dev
  IMAGE: asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rusuh/payment-service

permissions:
  contents: read
  id-token: write   # diperlukan untuk Workload Identity Federation

jobs:
  build-and-deploy:
    name: Test, Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Vet & unit test
        run: |
          go vet ./...
          go test ./... -coverprofile=coverage.out
          # Report coverage sebagai informasi. Gate akan dinaikkan ke 90% bertahap
          # seiring Task 9 (unit test coverage) diselesaikan per service.
          go tool cover -func=coverage.out | grep total

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

      - name: Build Docker image (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Deploy hanya saat push ke main (bukan PR)
      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            OTEL_ENABLED=${{ vars.OTEL_ENABLED }}
            OTEL_SAMPLE_RATIO=${{ vars.OTEL_SAMPLE_RATIO }}
            APP_ENV=${{ vars.APP_ENV }}
            APP_PORT=${{ vars.APP_PORT }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            LOG_FORMAT=${{ vars.LOG_FORMAT }}
            DB_HOST=${{ vars.DB_HOST }}
            DB_PORT=${{ vars.DB_PORT }}
            DB_USER=${{ vars.DB_USER }}
            DB_NAME=${{ vars.DB_NAME }}
            DB_SSL_MODE=${{ vars.DB_SSL_MODE }}
            DB_MAX_OPEN_CONNS=${{ vars.DB_MAX_OPEN_CONNS }}
            DB_MAX_IDLE_CONNS=${{ vars.DB_MAX_IDLE_CONNS }}
            DB_CONN_TIMEOUT_SECONDS=${{ vars.DB_CONN_TIMEOUT_SECONDS }}
            KAFKA_BROKERS=${{ vars.KAFKA_BROKERS }}
            KAFKA_TLS=${{ vars.KAFKA_TLS }}
            VALKEY_ADDR=${{ vars.VALKEY_ADDR }}
            VALKEY_TLS=${{ vars.VALKEY_TLS }}
            MIDTRANS_ENV=${{ vars.MIDTRANS_ENV }}
            SSE_HEARTBEAT_SECONDS=${{ vars.SSE_HEARTBEAT_SECONDS }}
          env_vars_update_strategy: overwrite
          secrets: |
            DB_PASSWORD=db-password:latest
            PAYMENT_TOKEN_SECRET=payment-token-secret:latest
            VALKEY_PASSWORD=redis-password:latest
            MIDTRANS_SERVER_KEY=midtrans-server-key:latest
            MIDTRANS_SIGNATURE_KEY=midtrans-signature-key:latest
          secrets_update_strategy: overwrite
          flags: >-
            --allow-unauthenticated
            --port=${{ vars.APP_PORT }}
            --vpc-connector=${{ vars.VPC_CONNECTOR }}
            --vpc-egress=private-ranges-only
            --min-instances=1
            --no-traffic

      - name: Route traffic to new revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
