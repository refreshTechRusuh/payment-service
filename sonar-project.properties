sonar.organization=refreshtechrusuh
sonar.projectKey=refreshTechRusuh_payment-service
sonar.projectName=Payment Service
sonar.projectVersion=1.0

# SonarQube Cloud's current analysis-scope UX scans the repository by default.
# Keep only the service's internal Go code; Go *_test.go files are detected as tests.
sonar.exclusions=cmd/**,pkg/**,**/_mock/**,**/vendor/**,**/node_modules/**,**/bin/**,**/dist/**,**/build/**,**/.scannerwork/**,**/coverage/**,**/coverage.out,**/coverage.filtered.out,**/generated/**,**/*_generated.go,**/*.pb.go,**/testdata/**,**/fixtures/**,**/fixture/**,**/*_fixture.go

# Generated by `go test ./... -race -covermode=atomic -coverprofile=coverage.out`.
sonar.go.coverage.reportPaths=coverage.out
